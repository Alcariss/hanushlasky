name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    uses: Alcariss/pwa-kit/.github/workflows/deploy-pages.yml@v1
    with:
      auth-providers: google,github
    secrets:
      VITE_API_URL_PRIMARY: ${{ secrets.VITE_API_URL_PRIMARY }}
